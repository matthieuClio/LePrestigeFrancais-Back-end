services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql
    ports:
    - "5432:5432"
    # env_file:
    # - .env.example
volumes:
  postgres-data: